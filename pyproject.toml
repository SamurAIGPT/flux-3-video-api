[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-3-video-api"
version = "0.2.0"
authors = [
  { name="Anil Matcha" },
]
description = "Python wrapper for Black Forest Labs' FLUX 3 video API — Text-to-Video, Image-to-Video, Start-End-to-Video, Video Extend, and Video Upscaler with native synchronized audio."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "python-dotenv",
    "mcp[cli]"
]

[tool.setuptools]
py-modules = ["flux3_video_api", "mcp_server"]
